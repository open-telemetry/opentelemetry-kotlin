name: ci-build

on:
  push:
    branches: [ main ]
  pull_request:

# Gradle caching policy:
# - Never trigger this workflow on release or tag events, which should publish without any cache.
# - Only pushes to main write the cache. PR runs restore main's entries read-only

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build logic tests
        run: ./gradlew :buildSrc:test --warn

      # By default Kotlin/Native compiles inside the Gradle daemon, where parallel compiles and links
      # exhaust the daemon heap. Running it in separate processes avoids GC thrashing.
      - name: Gradle Build
        run: |
          ./gradlew ciBuild -x :gradle-integration-test:test --warn \
            -Pkotlin.native.disableCompilerDaemon=true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: open-telemetry/opentelemetry-kotlin
          fail_ci_if_error: false
          files: build/reports/kover/report.xml

  # Runs on macOS because simulator tests need a macOS host. tvOS runs the same appleMain code as
  # iOS, so only the iOS simulator tests run; tvOS klibs are still compiled by integration-test.
  apple-simulator-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # macOS runners have 3 CPUs and ~7 GB of RAM, less than the 8 GB heaps gradle.properties sets
      # for the Gradle and Kotlin daemons. Shrink the Gradle daemon, compile Kotlin/JVM inside it
      # rather than in a second daemon, and run Kotlin/Native in separate processes.
      - name: iOS simulator tests
        run: |
          ./gradlew iosSimulatorArm64Test --warn \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.native.disableCompilerDaemon=true

  # Runs on Linux: Kotlin/Native cross-compiles and publishes the Apple klibs from a Linux host
  # (as release.yml does), and the klib fixture only compiles klibs without linking Apple binaries.
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Same Gradle settings as apple-simulator-test. Both steps pass identical flags so the second
      # step reuses the first step's daemon rather than starting another one.
      - name: Publish snapshot to Maven local
        run: |
          ./gradlew publishToMavenLocal -PsnapshotPublish=true --warn \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.native.disableCompilerDaemon=true

      - name: Gradle Integration Test
        run: |
          ./gradlew :gradle-integration-test:test --warn \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Pkotlin.native.disableCompilerDaemon=true

  required-status-check:
    permissions:
      contents: read
      issues: write
    needs:
      - gradle-test
      - apple-simulator-test
      - integration-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: |
          needs.gradle-test.result != 'success' || needs.apple-simulator-test.result != 'success' ||
          needs.integration-test.result != 'success'
        run: exit 1
