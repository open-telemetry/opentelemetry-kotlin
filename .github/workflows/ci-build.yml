name: ci-build

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ released ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gradle-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Gradle Build
        run: ./gradlew build linuxX64Test linkDebugTestLinuxArm64 :benchmark-android:assemble :benchmark-android:compileReleaseAndroidTestKotlin :benchmark-jvm:assemble :examples:example-app-android:assembleRelease koverXmlReport -x :gradle-integration-test:test --stacktrace

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Linux ARM64 tests
        timeout-minutes: 10
        run: |
          mapfile -d '' binaries < <(find "$PWD" -path '*/build/bin/linuxArm64/debugTest/test.kexe' -print0)
          test "${#binaries[@]}" -gt 0
          for binary in "${binaries[@]}"; do
            docker run --rm --platform linux/arm64 --network none \
              --mount "type=bind,source=$(dirname "$binary"),target=/tests,readonly" \
              --workdir /tests ubuntu:24.04 /tests/test.kexe
          done

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: open-telemetry/opentelemetry-kotlin
          fail_ci_if_error: false
          files: build/reports/kover/report.xml

  # Runs on macOS because the klib fixture consumes the library's iOS klibs, which KGP only
  # publishes from a macOS host. The rest of the suite is host-independent, so it all runs here.
  integration-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Publish snapshot to Maven local
        run: ./gradlew publishToMavenLocal -PsnapshotPublish=true --stacktrace

      - name: Gradle Integration Test
        run: ./gradlew :gradle-integration-test:test --stacktrace

  required-status-check:
    permissions:
      contents: read
      issues: write
    needs:
      - gradle-test
      - integration-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: |
          needs.gradle-test.result != 'success' || needs.integration-test.result != 'success'
        run: exit 1
